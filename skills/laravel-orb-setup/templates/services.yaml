# Long-running services for Amp orbs: the orb's `composer run dev`.
# Generated by Amplify (https://github.com/springloadedco/amplify).
# Start them with `amp orb services ensure`; the Portal tab also starts them on demand.
# Ports and shared settings live in .amp/orb.env, which every command loads first.
# Amp reads ${...} inside a command as a service reference, so commands use $VAR and sed instead.
services:
  web:
    # Same-origin proxy in front of the app, Vite (with HMR), and Reverb. See .amp/orb-proxy.mjs.
    # It waits for the app while it boots, so the first request after `ensure` does not fail.
    command: set -a && . .amp/orb.env && set +a && exec node .amp/orb-proxy.mjs
    portal: true
  app:
    # APP_URL and ASSET_URL come from the portal's public URL at run time instead of .env.
    # --no-reload makes `serve` pass this environment through to PHP. PHP_INI_SCAN_DIR adds
    # .amp/php/amplify.ini to PHP's own ini files, so requests from the HTTPS portal count as
    # HTTPS without app changes; see .amp/php/portal.php.
    command: >-
      set -a && . .amp/orb.env && set +a &&
      export AMPLIFY_ROOT="$PWD" PHP_INI_SCAN_DIR=":$PWD/.amp/php" &&
      export APP_URL="$(echo "$APP_URL" | sed 's:/*$::')" &&
      export ASSET_URL="$APP_URL" &&
      php artisan optimize:clear &&
      exec php artisan serve --host=127.0.0.1 --port="$AMPLIFY_APP_PORT" --no-reload
    env:
      APP_URL: ${services.web.publicURL}
      PHP_CLI_SERVER_WORKERS: "4"
  vite:
    # The app's own `dev` script (vite or Vite+'s `vp dev`) with hot reload, wrapped by
    # .amp/vite.config.mjs. `npm run` works whichever package manager installed node_modules.
    command: set -a && . .amp/orb.env && set +a && exec npm run dev -- --config .amp/vite.config.mjs
    env:
      APP_URL: ${services.web.publicURL}
  queue:
    command: set -a && . .amp/orb.env && set +a && exec php artisan queue:listen --tries=1 --timeout=0
    env:
      APP_URL: ${services.web.publicURL}
  reverb:
    # Only for apps that require laravel/reverb.
    command: set -a && . .amp/orb.env && set +a && exec php artisan reverb:start --host=127.0.0.1 --port="$REVERB_PORT"
  mail:
    # Mailpit catches everything the app sends; open its portal to read it.
    command: set -a && . .amp/orb.env && set +a && exec mailpit --listen "0.0.0.0:$PORT" --smtp "127.0.0.1:$MAIL_PORT"
    portal:
      title: Mailpit
      description: Every email the app sends lands here.
